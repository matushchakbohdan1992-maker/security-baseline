# Підключення продукту до security-baseline.
# Скопійовано scripts/install-baseline.sh — профіль і власника підставлено автоматично.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # щопонеділка: нові вразливості в незмінному коді
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: __OWNER__/security-baseline/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
    with:
      profile: "__PROFILE__"
      # image-ref: "ghcr.io/__OWNER__/my-app:latest"   # якщо продукт збирається в Docker

  # ШІ-рев'ю PR. Увімкнути: Settings → Secrets and variables → Actions →
  # секрет ANTHROPIC_API_KEY + змінна ENABLE_AI_REVIEW = true
  ai-review:
    if: ${{ github.event_name == 'pull_request' && vars.ENABLE_AI_REVIEW == 'true' }}
    uses: __OWNER__/security-baseline/.github/workflows/ai-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
