# Самоперевірка security-baseline: лінт workflow, тести правил,
# і прогін власного security-scan на цьому ж репозиторії.

name: self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint-and-test:
    name: Lint workflows + test rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml templates/project/.github/workflows/*.yml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test baseline semgrep rules
        run: |
          python -m pip install --disable-pip-version-check "semgrep==1.183.0"
          python scripts/test-rules.py
      - name: Shell scripts syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  scan-self:
    name: Scan this repo
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
    with:
      profile: "web,ai"
      sbom: false
