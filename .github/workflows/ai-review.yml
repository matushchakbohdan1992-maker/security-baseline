# security-baseline: reusable AI security review of pull requests
# Використовує anthropics/claude-code-security-review.
#
# ВАЖЛИВО (з документації Anthropic): дія не захищена від prompt injection,
# тому запускається лише на PR із цього ж репозиторію (не з форків) і лише
# від довірених авторів. Потрібен секрет ANTHROPIC_API_KEY у репозиторії-продукті.
# Рекомендовано окремий ключ із лімітом витрат у консолі Anthropic.

name: ai-review

on:
  workflow_call:
    inputs:
      exclude-directories:
        description: "Папки через кому, які не аналізувати"
        type: string
        default: "node_modules,vendor,dist,build,Pods,.build"
      model:
        description: "Модель Claude (порожньо = за замовчуванням дії)"
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions: {}

jobs:
  review:
    name: AI security review (Claude)
    # лише PR, лише з цього ж репозиторію, лише від власника/учасників
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main @ 2026-11-01
        with:
          comment-pr: true
          upload-results: true
          exclude-directories: ${{ inputs.exclude-directories }}
          claude-model: ${{ inputs.model }}
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
